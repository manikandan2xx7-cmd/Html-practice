<!DOCTYPE html>
<html>
    <head>
        <title>my first html</title>
        <!-- Style attributes -->
        <style>
            table,tr,td,th{
                border: 1px solid black;
                border-collapse: collapse;
                padding: 6px;
                text-align: left;
            }
        </style>
    </head>
    <body>
        <!-- HTML TABLE TAGS -->
         <table>
            <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>Country</th>
            </tr>

            <tr>
                <td>VIJAY</td>
                <td>1234567</td>
                <td>India</td>
            </tr>

            <tr>
                <td>AJITH</td>
                <td>2345678</td>
                <td>America</td>
            </tr>

            <tr>
                <td>SURIYA</td>
                <td>3456789</td>
                <td>Usa</td>
            </tr>

            <tr>
                <td>VISHAL</td>
                <td>4567890</td>
                <td>Canada</td>
            </tr>

            <tr>
                <td>KARTHI</td>
                <td>5678901</td>
                <td>China</td>
            </tr>

            <tr>
                <td>SIVA</td>
                <td>6789012</td>
                <td>Japan</td>
            </tr>
         </table>
         <br>
         <br><!-- table 2 method -->
         <table>
            <tr>
                <th>name:</th>
                <th>Manikandan</th>
            </tr>

            <tr>
                <th rowspan="2">Telephone:</th>
                <td>9042014970</td>
            </tr>

            <tr>
                <td>8056979300</td>
            </tr>
         </table>
         <br>
         <br><!-- table 3 methods -->
         <table>
            <tr>
                <th>name</th>
                <th colspan="2">Telephone</th>
            </tr>

            <tr>
                <td>bill gates</td>
                <td>9042014970</td>
                <td>8056979300</td>
            </tr>
         </table>
    </body>
</html>
