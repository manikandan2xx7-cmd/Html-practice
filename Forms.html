<!DOCTYPE html>
<html>
    <head>
        <title>my first html</title>
    </head>
    <body>
        <!-- HTML FORMS TAGS -->
         <form>
            <!-- NAME -->
            <label>FIRST NAME :</label>
            <br>
            <input type="name" />
            <br>
            <!-- PASSWORD -->
            <br>
            <label>PASSWORD :</label>
            <br>
            <input type="password" />
            <br>
            <!-- SELECT OPTION -->
            <br>
            <label>SELECT A COURSE</label>
            <br>
            <select>
                <option>HTML</option>
                <option>CSS</option>
                <option>JAVA</option>
                <option>PYTHON</option>
            </select>
            <br>
            <!-- RADIO BUTTONS -->
            <h3>SELECT GENDER</h3>
            <label>Male</label>
            <input type="radio" name="gender"/>
            <label>Female</label>
            <input type="radio" name="gender"/>
            <label>others</label>
            <input type="radio" name="gender"/>
            <br>
            <!-- CHECK BOXES -->
            <br>
            <h3>SELECT LANGUAGE</h3>
            <label>TAMIL</label>
            <input type="checkbox" name="gender"/>
            <label>ENGLISH</label>
            <input type="checkbox" name="gender"/>
            <label>HINDI</label>
            <input type="checkbox" name="gender"/>
            <br>
            <!-- COLOUR -->
            <br>
            <label>SELCT YOUR COLOUR :</label>
            <input type="color" value="red"/>
            <br>
            <!-- DATE -->
            <br>
            <label>SELECT YOUR DATE :</label>
            <input type="date" />
            <br>
            <!-- CHOOSE FILE -->
            <br>
            <label>SELECT A FILE : </label>
            <input type="file" />
            <br>
            <!-- TEXT AREA -->
            <br>
            <textarea cols="20" rows="10"></textarea>
            <br>
            <br>
            <input type="SUBMIT" />
         </form>
    </body>
</html>
